name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests run against mocks — no Playwright browser install needed.
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest tests/
