name: Court monitor

on:
  schedule:
    # Every 30 min, 05:00-21:30 UTC (06:00-22:30 London in summer).
    # Cadence/cost trade-offs are explained in DEPLOY.md.
    - cron: "0,30 5-21 * * *"
  workflow_dispatch:

# Never let two check runs overlap (they would race on state.json).
concurrency:
  group: court-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Run one check cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUTHORIZED_CHAT_ID: ${{ secrets.AUTHORIZED_CHAT_ID }}
        run: python -m src.main --once

      - name: Upload debug dump (only exists if parsing failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: data/debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "Update monitor state [skip ci]"
            # A concurrent edit to the branch loses to the user: skip this
            # save rather than fight — next run recomputes tracking state.
            git pull --rebase || { git rebase --abort; echo "Concurrent edit, skipping state commit"; exit 0; }
            git push
          fi
